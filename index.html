<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Le Cadavre Exquis</title>
<style>
  :root {
    --bg: #efece6;
    --flip-ms: 420;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    touch-action: manipulation;      /* no double-tap zoom on phones */
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Vertical frame: three stacked 3:2 panels = overall 1:2 aspect.
     Fit inside the viewport whatever its shape. */
  #stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  #corpse {
    aspect-ratio: 1 / 2;
    height: 100%;
    max-height: 100vh;
    max-width: 100vw;
    display: flex;
    flex-direction: column;
  }
  @supports not (aspect-ratio: 1 / 2) {
    #corpse { width: 50vh; }         /* fallback for very old browsers */
  }

  .panel {
    flex: 1 1 0;
    min-height: 0;
    perspective: 1200px;             /* flipboard depth */
    position: relative;
  }
  .card {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    will-change: transform;
  }
  .card img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="corpse">
    <div class="panel" data-part="head"><div class="card"><img alt="head"></div></div>
    <div class="panel" data-part="torso"><div class="card"><img alt="torso"></div></div>
    <div class="panel" data-part="leg"><div class="card"><img alt="leg"></div></div>
  </div>
</div>

<script>
/* ------------------------------------------------------------------
   Add or remove drawings here. Paths are relative to this html file.
------------------------------------------------------------------- */
const PARTS = {
  head:  ["Body Parts/HEAD/H_01.png",  "Body Parts/HEAD/H_02.png",  "Body Parts/HEAD/H_03.png"],
  torso: ["Body Parts/TORSO/T_01.png", "Body Parts/TORSO/T_02.png", "Body Parts/TORSO/T_03.png"],
  leg:   ["Body Parts/LEG/L_01.png",   "Body Parts/LEG/L_02.png",   "Body Parts/LEG/L_03.png"]
};

const FLIP_MS   = 220;   // duration of one half-flip (out or in)
const STAGGER   = 180;   // delay between head / torso / leg flips

const current = { head: -1, torso: -1, leg: -1 };
let busy = false;

/* Preload everything so flips never show a blank panel */
Object.values(PARTS).flat().forEach(src => { const i = new Image(); i.src = src; });

function pickNew(part) {
  const list = PARTS[part];
  if (list.length < 2) return 0;
  let idx;
  do { idx = Math.floor(Math.random() * list.length); }
  while (idx === current[part]);
  return idx;
}

/* Flipboard: rotate the card away, swap the image at 90°, rotate back */
function flip(panel, part, newIdx, delay) {
  const card = panel.querySelector(".card");
  const img  = card.querySelector("img");

  const out = card.animate(
    [{ transform: "rotateX(0deg)" }, { transform: "rotateX(-90deg)" }],
    { duration: FLIP_MS, delay, easing: "ease-in", fill: "forwards" }
  );

  out.onfinish = () => {
    img.src = PARTS[part][newIdx];
    current[part] = newIdx;
    card.animate(
      [{ transform: "rotateX(90deg)" }, { transform: "rotateX(0deg)" }],
      { duration: FLIP_MS, easing: "ease-out", fill: "forwards" }
    );
  };
}

function shuffle() {
  if (busy) return;
  busy = true;

  const panels = document.querySelectorAll(".panel");
  panels.forEach((panel, i) => {
    const part = panel.dataset.part;
    flip(panel, part, pickNew(part), i * STAGGER);
  });

  const total = FLIP_MS * 2 + STAGGER * (panels.length - 1);
  setTimeout(() => { busy = false; }, total + 50);
}

/* First fill: no animation, just place random images */
window.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".panel").forEach(panel => {
    const part = panel.dataset.part;
    const idx  = pickNew(part);
    current[part] = idx;
    panel.querySelector("img").src = PARTS[part][idx];
  });
});

/* Any click, tap or key press shuffles all three */
document.addEventListener("pointerdown", shuffle);
document.addEventListener("keydown", e => { if (!e.repeat) shuffle(); });
</script>
</body>
</html>
