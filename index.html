<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Le Cadavre Exquis</title>
<style>
  :root {
  --bg: #111111;
  --flip-ms: 420;
}
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
  height: 100%;
  background: #111111;
  overflow: hidden;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

  /* Vertical frame: three stacked 3:2 panels = overall 1:2 aspect.
     Fit inside the viewport whatever its shape. */
  #stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(4px, 1vw, 16px);
    cursor: pointer;
  }
  .corpse {
    aspect-ratio: 1 / 2;
    height: 100%;
    max-height: 100vh;
    max-width: 100vw;
    display: flex;
    flex-direction: column;
  }
  @supports not (aspect-ratio: 1 / 2) {
    .corpse { width: 50vh; }         /* fallback for very old browsers */
  }

  /* Phones / portrait: a single body */
  .corpse:nth-child(n + 2) { display: none; }

  /* Desktop / landscape: three bodies fill the width */
  @media (orientation: landscape) and (min-width: 640px) {
    .corpse:nth-child(n + 2) { display: flex; }
    .corpse { max-width: calc((100vw - 32px) / 3); }
  }

  .panel {
    flex: 1 1 0;
    min-height: 0;
    perspective: 1200px;             /* flipboard depth */
    position: relative;
  }
  .card {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    will-change: transform;
  }
  .card img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="stage">
  <div class="corpse">
    <div class="panel" data-part="head"><div class="card"><img alt="head"></div></div>
    <div class="panel" data-part="torso"><div class="card"><img alt="torso"></div></div>
    <div class="panel" data-part="leg"><div class="card"><img alt="leg"></div></div>
  </div>
  <div class="corpse">
    <div class="panel" data-part="head"><div class="card"><img alt="head"></div></div>
    <div class="panel" data-part="torso"><div class="card"><img alt="torso"></div></div>
    <div class="panel" data-part="leg"><div class="card"><img alt="leg"></div></div>
  </div>
  <div class="corpse">
    <div class="panel" data-part="head"><div class="card"><img alt="head"></div></div>
    <div class="panel" data-part="torso"><div class="card"><img alt="torso"></div></div>
    <div class="panel" data-part="leg"><div class="card"><img alt="leg"></div></div>
  </div>
</div>

<script>
/* ------------------------------------------------------------------
   Add or remove drawings here. Paths are relative to this html file.
------------------------------------------------------------------- */
const PARTS = {
  head:  ["BODY PARTS/HEAD/H_01.png",  "BODY PARTS/HEAD/H_02.png",  "BODY PARTS/HEAD/H_03.png",
          "BODY PARTS/HEAD/H_04.png",  "BODY PARTS/HEAD/H_05.png",  "BODY PARTS/HEAD/H_06.png"],
  torso: ["BODY PARTS/TORSO/T_01.png", "BODY PARTS/TORSO/T_02.png", "BODY PARTS/TORSO/T_03.png",
          "BODY PARTS/TORSO/T_04.png", "BODY PARTS/TORSO/T_05.png", "BODY PARTS/TORSO/T_06.png"],
  leg:   ["BODY PARTS/LEG/L_01.png",   "BODY PARTS/LEG/L_02.png",   "BODY PARTS/LEG/L_03.png",
          "BODY PARTS/LEG/L_04.png",   "BODY PARTS/LEG/L_06.png", "BODY PARTS/LEG/L_07.png"]
};

const FLIP_MS   = 220;   // duration of one half-flip (out or in)
const STAGGER   = 180;   // delay between head / torso / leg flips

let busy = false;

/* Preload everything so flips never show a blank panel */
Object.values(PARTS).flat().forEach(src => { const i = new Image(); i.src = src; });

/* ------------------------------------------------------------------
   Permutation queue: every possible (head, torso, leg) triple is
   played exactly once, in random order, before any combination can
   repeat. When the deck is exhausted it reshuffles for the next round
   (guarding against the last combo of one round leading the next).
------------------------------------------------------------------- */
function buildDeck() {
  const deck = [];
  for (let h = 0; h < PARTS.head.length;  h++)
  for (let t = 0; t < PARTS.torso.length; t++)
  for (let l = 0; l < PARTS.leg.length;   l++)
    deck.push({ head: h, torso: t, leg: l });
  return deck;
}
function shuffleArray(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let deck = shuffleArray(buildDeck());
let deckPos = 0;

function nextCombo() {
  if (deckPos >= deck.length) {
    const last = deck[deck.length - 1];
    do { shuffleArray(deck); }
    while (deck.length > 1 &&
           deck[0].head === last.head &&
           deck[0].torso === last.torso &&
           deck[0].leg === last.leg);
    deckPos = 0;
  }
  return deck[deckPos++];
}

/* Flipboard: rotate the card away, swap the image at 90°, rotate back */
function flip(panel, part, newIdx, delay) {
  const card = panel.querySelector(".card");
  const img  = card.querySelector("img");

  const out = card.animate(
    [{ transform: "rotateX(0deg)" }, { transform: "rotateX(-90deg)" }],
    { duration: FLIP_MS, delay, easing: "ease-in", fill: "forwards" }
  );

  out.onfinish = () => {
    img.src = PARTS[part][newIdx];
    card.animate(
      [{ transform: "rotateX(90deg)" }, { transform: "rotateX(0deg)" }],
      { duration: FLIP_MS, easing: "ease-out", fill: "forwards" }
    );
  };
}

/* An element is on screen only if it isn't display:none'd by CSS */
const isVisible = el => el.offsetParent !== null;

function shuffle() {
  if (busy) return;
  busy = true;

  /* Deal each on-screen body its own combination from the deck */
  const bodies = [...document.querySelectorAll(".corpse")].filter(isVisible);
  bodies.forEach(body => {
    const combo = nextCombo();
    body.querySelectorAll(".panel").forEach((panel, i) => {
      const part = panel.dataset.part;
      flip(panel, part, combo[part], i * STAGGER);
    });
  });

  const total = FLIP_MS * 2 + STAGGER * 2;   // 3 panels per body, staggered
  setTimeout(() => { busy = false; }, total + 50);
}

/* First fill: no animation. Fill every body (even hidden ones, so a
   phone rotated to landscape already has all three ready). */
window.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".corpse").forEach(body => {
    const combo = nextCombo();
    body.querySelectorAll(".panel").forEach(panel => {
      const part = panel.dataset.part;
      panel.querySelector("img").src = PARTS[part][combo[part]];
    });
  });
});

/* Any click, tap or key press shuffles all three */
document.addEventListener("pointerdown", shuffle);
document.addEventListener("keydown", e => { if (!e.repeat) shuffle(); });
</script>
</body>
</html>
